name: London Temperature Market

on:
  schedule:
    # GitHub cron is UTC. These cover 15:55 Europe/London in both DST modes;
    # the script skips the schedule that is not currently 15:55 in London.
    - cron: '55 14 * * *'
    - cron: '55 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately, regardless of the London time window
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: london-temperature-market
  cancel-in-progress: false

jobs:
  save-prediction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          check-latest: true

      - name: Show runtime
        run: node --version

      - name: Save London prediction
        run: node scripts/london-temperature-market.mjs
        env:
          LONDON_MARKET_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}

      - name: Commit prediction
        run: |
          if git diff --quiet -- static/data/london-temperature-predictions.json; then
            echo "No prediction changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/london-temperature-predictions.json
          git commit -m "Save London temperature market prediction"
          git push

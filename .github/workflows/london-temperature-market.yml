name: London Temperature Market

on:
  schedule:
    # Native IANA timezone scheduling handles BST/GMT automatically, so a single
    # cron entry is enough (avoids the old dual-UTC-cron workaround, which could
    # silently no-op if GitHub delayed the run past the script's narrow window).
    # :47 avoids the congested top-of-hour/:55 minutes that are more prone to delay.
    - cron: '47 15 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately, regardless of the London time window
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: london-temperature-market
  cancel-in-progress: false

jobs:
  save-prediction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          check-latest: true

      - name: Show runtime
        run: node --version

      - name: Save London prediction
        run: node scripts/london-temperature-market.mjs
        env:
          LONDON_MARKET_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}

      - name: Commit prediction
        run: |
          if git diff --quiet -- static/data/london-temperature-predictions.json; then
            echo "No prediction changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/london-temperature-predictions.json
          git commit -m "Save London temperature market prediction"
          git push

  deploy:
    needs: save-prediction
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
